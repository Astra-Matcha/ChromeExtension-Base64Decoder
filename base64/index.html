<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>Base64 Decoder</h1>
    </header>

    <div class="input-group">
      <label for="input">Base64 Input</label>
      <textarea id="input" placeholder="Paste Base64 string here..."></textarea>
    </div>

    <div class="controls">
      <button id="convertBtn" class="btn-primary">Convert</button>
    </div>

    <div class="input-group">
      <label for="output">Decoded Output</label>
      <textarea id="output" readonly placeholder="Result will appear here..."></textarea>
    </div>

    <script src="script.js"></script>
  </body>
</html>
